<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prajjwal Personal Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --primary-surface-color: #1e1e1e;
      --secondary-surface-color: #2a2a2a;
      --primary-text-color: #e1e1e1;
      --secondary-text-color: #a0a0a0;
      --accent-color: #03dac6;
      --accent-hover-color: #018786;
      --line-chart-color-1: #BB86FC;
      --line-chart-color-2: #CF6679;
      --positive-balance-color: #03DAC6;
      --negative-balance-color: #CF6679;
    }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 2em;
      background-color: var(--bg-color);
      color: var(--primary-text-color);
    }
    h1, h2 { text-align: center; color: var(--primary-text-color); margin-top: 0; }
    .main-layout {
      display: flex;
      gap: 2em;
      max-width: 1200px;
      margin: auto;
    }
    .left-column, .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2em;
    }
    @media (max-width: 900px) {
      .main-layout { flex-direction: column; }
    }
    .metrics {
      display: flex;
      justify-content: space-around;
      background-color: var(--primary-surface-color);
      padding: 1.5em;
      border-radius: 8px;
      text-align: center;
      flex-wrap: wrap; /* Added for better wrapping on small screens */
      gap: 1em; /* Added for spacing */
    }
    .metric-item h3 {
      margin: 0 0 0.5em 0;
      font-size: 1em;
      color: var(--secondary-text-color);
    }
    .metric-item p {
      margin: 0;
      font-size: 1.5em;
      color: var(--accent-color);
      font-weight: bold;
    }
    form {
      background: var(--primary-surface-color);
      padding: 2em;
      border-radius: 8px;
    }
    label {
      display: block;
      margin-bottom: 0.5em;
      font-weight: bold;
      color: var(--secondary-text-color);
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 1.5em;
      border-radius: 5px;
      border: 1px solid var(--secondary-surface-color);
      box-sizing: border-box;
      font-size: 1em;
      background-color: var(--secondary-surface-color);
      color: var(--primary-text-color);
    }
    select option {
      background: var(--primary-surface-color);
      color: var(--primary-text-color);
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin-bottom: 1.5em;
      align-items: center;
    }
    .radio-group input[type="radio"] {
      accent-color: var(--accent-color);
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      background-color: var(--accent-color);
      color: var(--bg-color);
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.1em;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: var(--accent-hover-color);
    }
    #status, #balanceStatus {
      text-align: center;
      font-weight: bold;
      min-height: 20px;
      margin-top: 1em;
    }
    .sheet-link-btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: transparent;
      border: 2px solid var(--accent-color);
      color: var(--accent-color) !important;
      padding: 12px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      margin-top: auto;
      transition: all 0.2s;
    }
    .sheet-link-btn:hover {
      background-color: var(--accent-color);
      color: var(--bg-color) !important;
    }
    .chart-container {
      background-color: var(--primary-surface-color);
      padding: 1.5em;
      border-radius: 8px;
    }
    /* NEW: Styles for the balance settings form */
    .balance-settings-container {
      background: var(--primary-surface-color);
      padding: 2em;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <h1>Prajjwal's Personal Tracker</h1>

    <div class="main-layout">
      <div class="left-column">
        <div class="dashboard-container">
          <h2>Dashboard</h2>
          <div class="metrics">
            <div class="metric-item"><h3>Total Spent</h3><p id="total-spent">₹0</p></div>
            <div class="metric-item"><h3>Bank Balance</h3><p id="bank-balance">₹0</p></div>
            <div class="metric-item"><h3>Cash Balance</h3><p id="cash-balance">₹0</p></div>
          </div>
          <div class="metrics" style="margin-top: 1em;">
            <div class="metric-item"><h3>Last 7 Days</h3><p id="spent-7-days">₹0</p></div>
            <div class="metric-item"><h3>Avg. Daily</h3><p id="avg-daily">₹0</p></div>
            <div class="metric-item"><h3>Avg. Monthly</h3><p id="avg-monthly">₹0</p></div>
          </div>
        </div>

        <form id="expenseForm">
          <h2>Add New Expense</h2>
          <label for="date">Date:</label>
          <input type="date" id="date" name="date" required>

          <label for="description">Description:</label>
          <input type="text" id="description" name="description" required>

          <label for="category">Category:</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>-- Select a Category --</option>
            <option value="Food & Dining">Food & Dining</option>
            <option value="Transportation">Transportation</option>
            <option value="Home & Utilities">Home & Utilities</option>
            <option value="Shopping & Personal Care">Shopping & Personal Care</option>
            <option value="Health & Wellness">Health & Wellness</option>
            <option value="Entertainment & Subscriptions">Entertainment & Subscriptions</option>
            <option value="Bills & EMIs">Bills & EMIs</option>
            <option value="Investment & Savings">Investment & Savings</option>
            <option value="Miscellaneous / Other">Miscellaneous / Other</option>
          </select>

          <label for="amount">Amount (₹):</label>
          <input type="number" id="amount" name="amount" required>

          <label>Payment Mode:</label>
          <div class="radio-group">
            <input type="radio" id="online" name="paymentMode" value="Online" checked required>
            <label for="online">Online</label>
            <input type="radio" id="cash" name="paymentMode" value="Cash">
            <label for="cash">Cash</label>
          </div>

          <button type="submit">Add Expense</button>
          <p id="status"></p>
        </form>

        <div class="balance-settings-container">
          <form id="balanceSettingsForm">
            <h2>Set Opening Balances</h2>
            <label for="openingBank">Opening Bank Balance (₹):</label>
            <input type="number" id="openingBank" name="openingBank" placeholder="e.g., 50000">

            <label for="openingCash">Opening Cash Balance (₹):</label>
            <input type="number" id="openingCash" name="openingCash" placeholder="e.g., 5000">

            <button type="submit">Save Balances</button>
            <p id="balanceStatus"></p>
          </form>
        </div>
      </div>

      <div class="right-column">
        <div class="chart-container">
          <h2>Category Breakdown</h2>
          <canvas id="categoryChart"></canvas>
        </div>
        <div class="chart-container">
          <h2>Daily vs. Average Spend (Last 30 Days)</h2>
          <canvas id="dailyAverageChart"></canvas>
        </div>
        <a href="#" id="sheet-link" class="sheet-link-btn" target="_blank">View All Expenses in Google Sheet</a>
      </div>
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxcKakacZC2t9ywuffliuoJkaSLgu15BCmpIjGzK-8NMgJgAY8R7mqyt5XLQ37_H7do/exec';
    const sheetURL = 'https://docs.google.com/spreadsheets/d/13q9G2xVmwsM02FyVXO0ZykVS3BMCTQrR3w9ddQ4AIU0/edit?gid=0#gid=0';

    const form = document.getElementById('expenseForm');
    const statusMsg = document.getElementById('status');
    // NEW: Get elements for balance form
    const balanceForm = document.getElementById('balanceSettingsForm');
    const balanceStatusMsg = document.getElementById('balanceStatus');

    document.getElementById('sheet-link').href = sheetURL;

    let allExpensesData = [];
    let categoryChart, dailyAverageChart;

    // --- EVENT LISTENERS ---
    document.addEventListener('DOMContentLoaded', () => {
        loadOpeningBalances();
        fetchData();
    });
    form.addEventListener('submit', handleFormSubmit);
    balanceForm.addEventListener('submit', handleBalanceFormSubmit);

    // --- FORM HANDLERS ---
    function handleFormSubmit(e) {
      e.preventDefault();
      statusMsg.textContent = 'Adding...';
      statusMsg.style.color = 'var(--primary-text-color)';
      fetch(scriptURL, { method: 'POST', body: new FormData(form) })
        .then(response => {
          statusMsg.textContent = 'Expense added successfully!';
          statusMsg.style.color = 'var(--accent-color)';
          form.reset();
          document.getElementById('date').valueAsDate = new Date(); // Reset date to today
          fetchData(); // Refetch all data to update dashboard
          setTimeout(() => { statusMsg.textContent = ''; }, 3000);
        })
        .catch(error => {
          statusMsg.textContent = 'Error! Could not add expense.';
          console.error('Error!', error.message);
        });
    }

    // NEW: Handle saving opening balances
    function handleBalanceFormSubmit(e) {
        e.preventDefault();
        const openingBank = document.getElementById('openingBank').value;
        const openingCash = document.getElementById('openingCash').value;

        localStorage.setItem('openingBankBalance', openingBank);
        localStorage.setItem('openingCashBalance', openingCash);

        balanceStatusMsg.textContent = 'Balances saved successfully!';
        balanceStatusMsg.style.color = 'var(--accent-color)';
        
        // Recalculate everything with the new balances
        processDataAndUpdateUI(allExpensesData);

        setTimeout(() => { balanceStatusMsg.textContent = ''; }, 3000);
    }
    
    // --- DATA FETCHING & PROCESSING ---
    function fetchData() {
      fetch(scriptURL)
        .then(response => response.json())
        .then(data => {
          allExpensesData = data.sort((a, b) => new Date(b.date) - new Date(a.date));
          processDataAndUpdateUI(allExpensesData);
        })
        .catch(error => console.error('Error fetching data:', error));
    }
    
    // NEW: This function now handles ALL calculations and UI updates
    function processDataAndUpdateUI(data) {
        if (!data || data.length === 0) {
            console.log("No data to process.");
            return;
        }

        // --- Balance Calculations ---
        const openingBank = parseFloat(localStorage.getItem('openingBankBalance')) || 0;
        const openingCash = parseFloat(localStorage.getItem('openingCashBalance')) || 0;

        const totalSpend = data.reduce((sum, item) => sum + Number(item.amount), 0);
        const totalOnlineSpend = data.filter(item => item.paymentMode === 'Online').reduce((sum, item) => sum + Number(item.amount), 0);
        const totalCashSpend = data.filter(item => item.paymentMode === 'Cash').reduce((sum, item) => sum + Number(item.amount), 0);
        
        const remainingBank = openingBank - totalOnlineSpend;
        const remainingCash = openingCash - totalCashSpend;
        
        document.getElementById('total-spent').textContent = `₹${totalSpend.toFixed(2)}`;
        const bankBalanceEl = document.getElementById('bank-balance');
        const cashBalanceEl = document.getElementById('cash-balance');
        
        bankBalanceEl.textContent = `₹${remainingBank.toFixed(2)}`;
        bankBalanceEl.style.color = remainingBank < 0 ? 'var(--negative-balance-color)' : 'var(--positive-balance-color)';
        
        cashBalanceEl.textContent = `₹${remainingCash.toFixed(2)}`;
        cashBalanceEl.style.color = remainingCash < 0 ? 'var(--negative-balance-color)' : 'var(--positive-balance-color)';
        

        // --- Other Metrics Calculations ---
        const today = new Date();
        const sevenDaysAgo = new Date();
        sevenDaysAgo.setDate(today.getDate() - 7);
        const last7DaysSpend = data.filter(item => new Date(item.date) >= sevenDaysAgo)
            .reduce((sum, item) => sum + Number(item.amount), 0);
        document.getElementById('spent-7-days').textContent = `₹${last7DaysSpend.toFixed(2)}`;

        const firstDate = new Date(data[data.length - 1].date);
        const totalDays = Math.max(1, (today - firstDate) / (1000 * 60 * 60 * 24));
        const avgDaily = totalSpend / totalDays;
        document.getElementById('avg-daily').textContent = `₹${avgDaily.toFixed(2)}`;
        
        const monthlyExpenses = {};
        data.forEach(item => {
            const monthYear = new Date(item.date).toISOString().slice(0, 7);
            if (!monthlyExpenses[monthYear]) monthlyExpenses[monthYear] = 0;
            monthlyExpenses[monthYear] += Number(item.amount);
        });
        const monthlyTotals = Object.values(monthlyExpenses);
        const avgMonthly = monthlyTotals.length > 0 ? monthlyTotals.reduce((sum, val) => sum + val, 0) / monthlyTotals.length : 0;
        document.getElementById('avg-monthly').textContent = `₹${avgMonthly.toFixed(2)}`;
        
        // --- Chart Rendering ---
        renderCategoryChart(data);
        renderDailyVsAverageChart(data, avgDaily);
    }
    
    // NEW: Function to load saved balances into the form
    function loadOpeningBalances() {
        const savedBank = localStorage.getItem('openingBankBalance');
        const savedCash = localStorage.getItem('openingCashBalance');

        if (savedBank) {
            document.getElementById('openingBank').value = savedBank;
        }
        if (savedCash) {
            document.getElementById('openingCash').value = savedCash;
        }
        document.getElementById('date').valueAsDate = new Date(); // Set date to today on load
    }

    // --- CHART RENDERING FUNCTIONS (Largely Unchanged) ---
    function renderCategoryChart(data) {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      const categoryTotals = {};
      data.forEach(item => {
        if (!categoryTotals[item.category]) categoryTotals[item.category] = 0;
        categoryTotals[item.category] += Number(item.amount);
      });
      const labels = Object.keys(categoryTotals);
      const amounts = Object.values(categoryTotals);
      const primaryTextColor = getComputedStyle(document.documentElement).getPropertyValue('--primary-text-color').trim();

      if (categoryChart) categoryChart.destroy();

      categoryChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            label: 'Expenses by Category',
            data: amounts,
            backgroundColor: ['#03DAC6', '#CF6679', '#BB86FC', '#FFDE03', '#3F51B5', '#4CAF50', '#FF9800', '#795548', '#607D8B'],
            hoverOffset: 4
          }]
        },
        options: { responsive: true, plugins: { legend: { position: 'top', labels: { color: primaryTextColor } } } }
      });
    }

    function renderDailyVsAverageChart(data, avgDaily) {
      const ctx = document.getElementById('dailyAverageChart').getContext('2d');
      const thirtyDaysAgo = new Date();
      thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

      const dailyTotals = {};
      data.forEach(item => {
        const itemDate = new Date(item.date);
        if (itemDate >= thirtyDaysAgo) {
          const dateString = itemDate.toISOString().slice(0, 10);
          if (!dailyTotals[dateString]) dailyTotals[dateString] = 0;
          dailyTotals[dateString] += Number(item.amount);
        }
      });

      const sortedDates = Object.keys(dailyTotals).sort();
      const labels = sortedDates.map(date => new Date(date).toLocaleDateString('en-IN', { month: 'short', day: 'numeric' }));
      const dailyData = sortedDates.map(date => dailyTotals[date]);
      const averageData = Array(labels.length).fill(avgDaily);

      const lineColor1 = getComputedStyle(document.documentElement).getPropertyValue('--line-chart-color-1').trim();
      const lineColor2 = getComputedStyle(document.documentElement).getPropertyValue('--line-chart-color-2').trim();
      const secondaryTextColor = getComputedStyle(document.documentElement).getPropertyValue('--secondary-text-color').trim();
      const secondarySurfaceColor = getComputedStyle(document.documentElement).getPropertyValue('--secondary-surface-color').trim();
      const primaryTextColor = getComputedStyle(document.documentElement).getPropertyValue('--primary-text-color').trim();

      if (dailyAverageChart) dailyAverageChart.destroy();

      dailyAverageChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { label: 'Daily Spend', data: dailyData, borderColor: lineColor1, backgroundColor: lineColor1, tension: 0.3, borderWidth: 2 },
            { label: 'Average Daily Spend', data: averageData, borderColor: lineColor2, backgroundColor: lineColor2, borderDash: [5, 5], pointRadius: 0, borderWidth: 2 }
          ]
        },
        options: {
          responsive: true,
          scales: {
            y: { ticks: { color: secondaryTextColor }, grid: { color: secondarySurfaceColor } },
            x: { ticks: { color: secondaryTextColor }, grid: { color: secondarySurfaceColor } }
          },
          plugins: { legend: { labels: { color: primaryTextColor } } }
        }
      });
    }
  </script>
</body>
</html>
